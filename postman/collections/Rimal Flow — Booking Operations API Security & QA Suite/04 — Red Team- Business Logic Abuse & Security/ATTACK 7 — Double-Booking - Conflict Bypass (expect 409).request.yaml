$kind: http-request
name: ATTACK 7 — Double-Booking / Conflict Bypass (expect 409)
url: "{{base_url}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{user_token}}
body:
  type: text
  content: |-
    {
      "spaceId": "{{space_id}}",
      "startDate": "{{dup_start}}",
      "endDate": "{{dup_end}}",
      "startTime": "09:00",
      "endTime": "12:00",
      "bookingType": "hourly"
    }
scripts:
  - type: beforeRequest
    code: |-
      const start = new Date(Date.now() + 24 * 60 * 60 * 1000);
      start.setUTCHours(9, 0, 0, 0);
      const end = new Date(start.getTime());
      end.setUTCHours(12, 0, 0, 0);
      pm.variables.set('dup_start', start.toISOString());
      pm.variables.set('dup_end', end.toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Overlapping slot is rejected with a conflict code (409/400/422)', function () {
          pm.expect([400, 409, 422]).to.include(pm.response.code);
      });

      pm.test('CRITICAL: double-booking the same space/time is not permitted', function () {
          if ([200, 201].includes(pm.response.code)) {
              pm.expect.fail('Conflicting booking accepted — conflict detection bypassed');
          } else {
              pm.expect(pm.response.code).to.be.below(500);
          }
      });

      pm.test('Conflict response is structured', function () {
          const body = pm.response.json();
          pm.expect(body).to.have.property('error');
      });
    language: text/javascript
order: 7000
