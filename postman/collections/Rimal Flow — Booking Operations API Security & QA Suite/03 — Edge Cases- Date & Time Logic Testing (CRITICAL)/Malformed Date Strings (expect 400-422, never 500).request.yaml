$kind: http-request
name: Malformed Date Strings (expect 400/422, never 500)
url: "{{base_url}}/api/bookings"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{user_token}}
body:
  type: text
  content: |-
    {
      "spaceId": "{{space_id}}",
      "startDate": "not-a-date",
      "endDate": "2026-13-45T99:99:99Z",
      "bookingType": "hourly"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Malformed date input is rejected (400/422)', function () {
          pm.expect([400, 422]).to.include(pm.response.code);
      });

      pm.test('CRITICAL: server did not crash on unparseable dates (no 500)', function () {
          pm.expect(pm.response.code).to.not.eql(500);
      });

      pm.test('No raw date-parsing exception leaked to the client', function () {
          const raw = pm.response.text();
          pm.expect(raw).to.not.include('Invalid time value');
          pm.expect(raw).to.not.include('RangeError');
      });
    language: text/javascript
order: 5000
